[project]
name = "homeostasis"
version = "0.1.0"
description = "Re-implementation of the homeostatic reservoir model from Falandays et al. (2024), 'A potential mechanism for Gibsonian resonance'"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]
viz = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeostasis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running behavioral tests (full simulations)",
]
